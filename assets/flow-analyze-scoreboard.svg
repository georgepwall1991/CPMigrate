<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">CPMigrate dependency analysis scoreboard</title>
  <desc id="desc">Real per-analyzer scoreboard from cpmigrate --analyze: version inconsistencies, duplicates, transitive conflicts, and security vulnerabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="920" height="400" rx="12" fill="url(#bg)"/>
  <rect x="16" y="16" width="888" height="368" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <rect x="16" y="16" width="888" height="44" rx="10" fill="#1e293b"/>
  <rect x="16" y="50" width="888" height="10" fill="#1e293b"/>
