  <rect x="28" y="308" width="864" height="44" rx="6" fill="#15202b"/>
  <text x="40" y="335" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">✔ Security Vulnerabilities</text>
