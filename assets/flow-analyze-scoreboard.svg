  <text x="620" y="231" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">░░░░░░░░░░</text>

  <rect x="28" y="256" width="864" height="44" rx="6" fill="#1a2332"/>
