  <text x="520" y="129" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ISSUES</text>
  <text x="620" y="129" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">SHARE</text>

  <rect x="28" y="152" width="864" height="44" rx="6" fill="#1a2332"/>
  <text x="40" y="179" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">! Version Inconsistencies</text>
