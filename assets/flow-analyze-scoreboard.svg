  <circle cx="66" cy="38" r="6" fill="#fbbf24"/>
  <circle cx="88" cy="38" r="6" fill="#4ade80"/>
  <text x="120" y="43" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">cpmigrate --analyze — dependency health scoreboard</text>

  <text x="36" y="88" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ANALYSIS COMPLETE: 2 ISSUES</text>

